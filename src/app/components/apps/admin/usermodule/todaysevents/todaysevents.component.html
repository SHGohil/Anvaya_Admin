
@if (showtab) {
  <div class="container-fluid pt-3">
    <app-page-header title="Today's Events" subtitle="{{currentDate}}{{ count == null ? '' : ' &middot; ' + (count === 1 ? '1 booking' : count + ' bookings') }}">
      <button class="btn btn-sm btn-primary" (click)="adddailyquery()">Daily Query Entry</button>
    </app-page-header>
    @if (todaysLoading) {
      <div class="row">
        @for (i of [1,2,3]; track i) {
          <div class="col-lg-12">
            <div class="skeleton" style="height: 150px; border-radius: 20px; margin-bottom: 1rem;"></div>
          </div>
        }
      </div>
    }
    @if (!todaysLoading&&todaysqueriesdata==null) {
      <div class="d-flex justify-content-center align-items-center mt-5 ">
        <img src="../../../../../../assets/images/no data.gif" alt="No Data" height="300" width="300" class="img-fluid">
      </div>
    }
    @if (!todaysLoading&&todaysqueriesdata) {
      <div class="row" >
        @for (item of todaysqueriesdata; track item) {
          <div class="col-lg-12" >
            <app-event-card-detailed [item]="item" (cardClick)="onviewdeails(item, content)"></app-event-card-detailed>
          </div>
        }
      </div>
    }
  </div>
}





<div class="card-body">
  <ng-template #content let-modal>
    <div class="modal-header ">
      <h4 class="modal-title">Event Details  </h4>
      <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
    </div>
    <div class="modal-body" >
      <app-event-detail [details]="viewdails" [showStatus]="true"></app-event-detail>
    </div>
  </ng-template>

</div>





@if (!showtab) {
  <div class="container-fluid" style="cursor:pointer">
    <app-addquery  ></app-addquery>
  </div>
}
