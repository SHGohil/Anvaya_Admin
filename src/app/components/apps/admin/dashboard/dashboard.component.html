<div >
    <div class="container-fluid" *ngIf="activebad==0" style="cursor:pointer">
        <app-addquery></app-addquery>
    </div>
    <div class="container-fluid" *ngIf="activebad==1" style="cursor:pointer">
        <!-- <app-analytics ></app-analytics> -->
    
    <app-todaysevents></app-todaysevents>
</div>
<div class="container-fluid"  *ngIf="activebad==2" style="cursor:pointer">

   
    <app-dailyreport></app-dailyreport>
</div>
<div class="container-fluid" *ngIf="activebad==3" style="max-height:500px;overflow-y: auto;cursor:pointer">

    <app-confirmedevents></app-confirmedevents>
</div>
<div  class="container-fluid" *ngIf="activebad==4" style="cursor:pointer" style="box-sizing: border-box;margin-top: -17px;">

    <app-calenderdates></app-calenderdates>
</div>
</div>
