<div class="ui-stack-lg">
  <app-page-header title="Notifications" subtitle="Recent activity on your events"></app-page-header>

  @if (notificationLoading) {
    <div class="ui-grid ui-cols">
      @for (i of [1,2,3]; track i) {
        <div class="ui-skeleton" style="height: 150px; border-radius: var(--r-lg);"></div>
      }
    </div>
  }
  @if (!notificationLoading && !usernotificationData?.length) {
    <div class="ui-card ui-empty">
      <strong>Nothing new</strong>
      <p class="ui-small">You're all caught up.</p>
    </div>
  }
  <div class="ui-grid ui-cols">
    @for (item of usernotificationData; track item) {
      <app-event-card-compact [item]="item.eventdetails" (cardClick)="onviewdeails(item, content)"></app-event-card-compact>
    }
  </div>
</div>

<ng-template #content let-modal>
  <div class="modal-header">
    <h4 class="modal-title">Event Details</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
  </div>
  <div class="modal-body">
    <app-event-detail [details]="viewdetails" [showStatus]="true"></app-event-detail>
  </div>
</ng-template>
