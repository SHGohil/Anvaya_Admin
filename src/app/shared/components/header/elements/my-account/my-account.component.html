<div class="ui-dd">
  <button type="button" class="ui-account" aria-label="Account menu">
    <span class="ui-avatar">{{ initials }}</span>
    <span class="ui-account-name">{{ username }}</span>
  </button>
  <div class="ui-dd-panel">
    <button type="button" class="ui-dd-item ui-dd-link" (click)="changepassword()">Change password</button>
    <button type="button" class="ui-dd-item ui-dd-link" (click)="logoutFunc()">Log out</button>
  </div>
</div>
