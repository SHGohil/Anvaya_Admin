<header class="ui-topbar">
  <button type="button" class="ui-btn ui-btn-ghost ui-btn-icon" (click)="sidebarToggle()" aria-label="Toggle menu">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
  <div class="ui-grow"></div>
  <button type="button" class="ui-btn ui-btn-ghost ui-btn-icon" (click)="toggleTheme()" [attr.aria-label]="dark ? 'Switch to light mode' : 'Switch to dark mode'">
    @if (dark) {
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    } @else {
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    }
  </button>
  <app-notification></app-notification>
  <app-my-account></app-my-account>
</header>
