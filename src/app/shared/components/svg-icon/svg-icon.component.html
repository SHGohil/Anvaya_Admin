<!--
  Renders one consistent icon style (feather's 24x24 outline set, inlined -
  matches the dashboard icons and KPI tiles already using this exact
  fill="none" stroke="currentColor" stroke-width="2" treatment) regardless
  of caller. Replaces the old theme's icon-sprite.svg reference, a second,
  visually different icon source (filled/mixed-weight glyphs) this
  component used to pull from - callers are unchanged, they still just
  pass an icon name via [icon].
-->
<svg class="stroke-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [ngSwitch]="icon">
  <ng-container *ngSwitchCase="'home'">
    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
    <polyline points="9 22 9 12 15 12 15 22"></polyline>
  </ng-container>
  <ng-container *ngSwitchCase="'user'">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
    <circle cx="12" cy="7" r="4"></circle>
  </ng-container>
  <ng-container *ngSwitchCase="'file'">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
    <polyline points="14 2 14 8 20 8"></polyline>
    <line x1="16" y1="13" x2="8" y2="13"></line>
    <line x1="16" y1="17" x2="8" y2="17"></line>
    <polyline points="10 9 9 9 8 9"></polyline>
  </ng-container>
  <ng-container *ngSwitchCase="'calender'">
    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
    <line x1="16" y1="2" x2="16" y2="6"></line>
    <line x1="8" y1="2" x2="8" y2="6"></line>
    <line x1="3" y1="10" x2="21" y2="10"></line>
  </ng-container>
  <ng-container *ngSwitchDefault>
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
  </ng-container>
</svg>
