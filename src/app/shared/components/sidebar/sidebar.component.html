<aside class="ui-sidebar" aria-label="Main navigation">
  <a class="ui-brand" routerLink="/">
    <span class="ui-brand-mark">A</span><span>Anvaya</span>
  </a>
  <nav class="ui-nav">
    @for (item of menuItems; track item.path || item.headTitle1) {
      @if (item.headTitle1) {
        <div class="ui-nav-label">{{ item.headTitle1 }}</div>
      } @else {
        <a [routerLink]="[item.path]" routerLinkActive="ui-active" [title]="item.title">
          <app-svg-icon [icon]="item.icon"></app-svg-icon>
          <span>{{ item.title }}</span>
        </a>
      }
    }
  </nav>
</aside>
